name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Postgres 18 + pgvector for the database tests (spec §12.1). Trust auth: no password exists.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # The suite creates, migrates and drops its own scratch database (test/global-setup.ts).
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
      # For the script steps below, which run exactly what Marcus runs against Railway.
      MIGRATION_DATABASE_URL: postgres://postgres@localhost:5432/nacre_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm db:verify
      - run: pnpm build
